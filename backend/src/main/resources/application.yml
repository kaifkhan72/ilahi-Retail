server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ilahi-retail-api

  # Database DataSource
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ilahi_retail}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # File upload limits
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Application custom configurations
app:
  api-prefix: /api/v1

  # JWT settings
  jwt:
    # 256-bit or 512-bit secure secret key
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)

  # Initial admin seeding (ROLE_ADMIN)
  admin:
    name: ${ADMIN_NAME:Store Admin}
    email: ${ADMIN_EMAIL:admin@ilahiretail.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
    phone: ${ADMIN_PHONE:9876543210}

  # File upload path
  upload:
    dir: ${UPLOAD_DIR:uploads}

  # CORS settings
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger OpenAPI docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
